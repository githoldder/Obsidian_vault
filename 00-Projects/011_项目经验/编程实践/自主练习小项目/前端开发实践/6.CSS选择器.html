<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 元素选择器 */
        h2 {
            color: orange;
        }
        /* 类选择器 */
        .higlight {
            color: purple;
        }
        /* ID选择器 */
        #header {
            font-size: 24px bold;
        }
        /* 通用选择器 */
        * {
            margin: 10px;
            font: 24px bold;
            color: orange;
        }
        /* 子元素选择器 */
        .father > .child {
            color: red;
        }
        /* 后代选择器（包含选择器） */
        .father p {
            color: blue;
        }
        /* 伪类选择器 */
        #header:hover {
            color: green;
        }
        /* 伪元素选择器 
            ：：before 在元素内容前添加内容
            ：：after 在元素内容后添加内容
        */

    </style>
</head>
<body>
    <h1>不同类型的css选择器</h1>
    <h2>这是一个元素选择器示例</h2>
    <h3 class="higlight">这是一个类选择器</h3>
    <h4>这是另一个类选择器</h4>
    <h4 id="header">这是一个ID选择器</h4>
    <div class="father">
        <div>
            <p class="grandson">这是一个后代选择器示例</p>
        </div>
        <p class="child">这是一个子元素选择器</p>
    </div>
</body>
</html>
