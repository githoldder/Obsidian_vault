<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端 rem 适配原理</title>
</head>
<style>
    /* html {
        font-size: 16px; 
    } */
    
    .box1{
        width: 300px;
        height: 300px;
        background-color: lightblue;
    }
    .box-rem{
        width: 1rem; /* 3rem = 3 * html的font-size */
        height: 3rem;
        background-color: lightcoral;
    }
</style>
<body>
    <div class="box1"></div>
    <div class="box-rem"></div>

    <script>
        //根据设备宽度计算html标签的font-size的属性值
        function resethtmlfontsize(){
            document.documentElement.style.fontSize = document.documentElement.clientWidth / 2 + "px";
        }
        resethtmlfontsize();
        //绑定事件
        window.onresize = resethtmlfontsize
    </script>
</body>
</html>
