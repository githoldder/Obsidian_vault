<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block {
        display: block;
        width: 120px;
        height: 30px;
        background-color: lightblue;
        margin-bottom: 20px;
    }
    .inline {
        display: inline;
        width: 1px; /* 无效 */
        height: 100px; /* 无效 */
        background-color: lightgreen;
    }
    .inline-block {
        display: inline-block;
        width: 150px;
        height: 100px;
        background-color: lightcoral;
    }
    </style>

</head>

<body>
    <h1 style="font: 50px 'kaiti';">这是一个font复合属性示例</h1>
    <p style="margin: 50px 100px 150px 200px;">这是一个margin复合属性示例</p>
    <p style="line-height: 30px;">这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本</p>

    <div class="block">这是一个块元素</div>
    <span class="inline">这是一个行内块元素</span>
    <img src="DM_20250102163003_001.jpg" alt="" class="inline-block">
</body>
</html>
