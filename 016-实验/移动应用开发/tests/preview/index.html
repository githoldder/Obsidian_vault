<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android UI 模拟预览 (实验一)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
        .device { width: 375px; height: 667px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; position: relative; border: 8px solid #333; }
        .screen { padding: 10px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; background: #fff;}
        .hidden { display: none !important; }
        h2 { text-align: center; font-size: 20px; font-weight: normal; margin-top: 10px; margin-bottom: 10px; color: #2669C6;}
        .hr-line { border-bottom: 2px solid #000; margin-bottom: 5px; }
        
        #list-container { flex: 1; overflow-y: auto; }
        .row { display: flex; border-bottom: 1px solid #000; padding: 10px 0; font-size: 16px; cursor: pointer; align-items: flex-start;}
        .row:active { background-color: #f0f0f0; }
        
        .col-img { width: 100px; height: 120px; background: #ddd; margin-right: 15px; flex-shrink: 0; object-fit: cover;}
        .col-img img { width: 100%; height: 100%; object-fit: cover; }
        .col-info { flex: 1; display: flex; flex-direction: column; }
        .info-line { display: flex; margin-bottom: 8px; }
        .info-line .label { color: #2669C6; margin-right: 5px; width: 55px;}
        .info-line .val { color: #000; }
        .btn-detail { width: 50px; height: 35px; background: #ddd; border: 1px solid #ccc; color: #2669C6; font-size: 14px; cursor: pointer; flex-shrink:0;}
        
        .btn-group { display: flex; margin-top: 10px; padding-bottom: 15px; justify-content: center;}
        .btn-group button { width: 100px; padding: 10px; margin: 0 20px; background: #00BFFF; border: none; font-size: 16px; cursor: pointer;}
        
        .flex-row { display: flex; align-items: center; margin-bottom: 15px; }
        .flex-row label { width: 60px; font-size: 16px; color: #2669C6;}
        .flex-row input[type="text"], .flex-row input[type="number"], .flex-row input[type="tel"] { flex: 1; padding: 5px; border: none; border-bottom: 1px solid #000; outline: none; font-size: 16px; }
        
        .add-top { display: flex; align-items: flex-start; }
        .add-left { flex: 1; display: flex; flex-direction: column;}
        .add-right { width: 100px; margin-left: 10px; display: flex; flex-direction: column; align-items: center; }
        .add-right .img-box { width: 100px; height: 120px; background: #ddd; margin-bottom: 5px; overflow: hidden;}
        .add-right .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .add-right button { width: 100%; border: 1px solid #ddd; padding: 5px; background: #eee; color: #2669C6; cursor: pointer;}

        .hobbies-grid { background: #f0f0f0; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex:1;}
        .hobbies-grid label { color: #000; width: auto; font-size: 14px;}
        
        .btn-confirm { width: 120px; padding: 10px; background: #00BFFF; border: 1px solid #000; font-size: 16px; margin: 0 10px; cursor: pointer;}
        
        #toast { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;}

        .modal-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:50; display:none; justify-content:center; align-items:center; }
        .modal-body { background:#fff; width:280px; border-radius:8px; padding:0; overflow:hidden; }
        .modal-title { padding:15px; font-size:18px; font-weight:bold; border-bottom:1px solid #eee; }
        .modal-item { display:flex; align-items:center; padding:12px 15px; border-bottom:1px solid #f0f0f0; cursor:pointer; }
        .modal-item:hover { background:#f5f5f5; }
        .modal-item img { width:40px; height:48px; object-fit:cover; margin-right:12px; border-radius:4px; }
        .modal-item span { font-size:16px; }
        .modal-cancel { padding:12px 15px; cursor:pointer; text-align:center; color:#999; font-size:16px; }
        .modal-cancel:hover { background:#f5f5f5; }
    </style>
</head>
<body>

<div class="device">
    <!-- Screen 1: List -->
    <div id="screen-list" class="screen">
        <h2>学生一览表</h2>
        <div class="hr-line"></div>
        <div id="list-container"></div>
        <div class="btn-group">
            <button onclick="navToAdd()">添加</button>
            <button onclick="alert('模拟器已关闭程序')">退出</button>
        </div>
    </div>

    <!-- Screen 2: Add -->
    <div id="screen-add" class="screen hidden" style="padding: 20px;">
        <h2>学生信息添加</h2>
        
        <div class="add-top">
            <div class="add-left">
                <div class="flex-row">
                    <label>学号</label>
                    <input type="number" id="etId" placeholder="请输入学号">
                </div>
                <div class="flex-row">
                    <label>姓名</label>
                    <input type="text" id="etName" placeholder="请输入姓名">
                </div>
                <div class="flex-row">
                    <label>性别</label>
                    <input type="radio" name="gender" value="男" checked> 男 
                    <input type="radio" name="gender" value="女" style="margin-left:10px;"> 女
                </div>
                <div class="flex-row">
                    <label>年龄</label>
                    <input type="number" id="etAge" placeholder="16~30">
                </div>
                <div class="flex-row">
                    <label>班级</label>
                    <input type="text" id="etClazz" placeholder="如23计一">
                </div>
            </div>
            <div class="add-right">
                <div class="img-box" id="ivAddAvatar"><img id="avatarPreview" src="img/026486c12f73a9ae0dcb692cc6313b94_720.png"></div>
                <button onclick="document.getElementById('avatarModal').style.display='flex'">选择图片</button>
            </div>
        </div>

        <div class="flex-row" style="margin-top:10px;">
            <label style="width:70px;">手机号</label>
            <input type="tel" id="etPhone" placeholder="11位数字">
        </div>
        
        <div class="flex-row" style="align-items: flex-start;">
            <label style="width:70px; margin-top:10px;">兴趣爱好</label>
            <div class="hobbies-grid">
                <label><input type="checkbox" value="篮球" class="cb-hobby"> 篮球</label>
                <label><input type="checkbox" value="排球" class="cb-hobby"> 排球</label>
                <label><input type="checkbox" value="羽毛球" class="cb-hobby"> 羽毛球</label>
                <label><input type="checkbox" value="乒乓球" class="cb-hobby"> 乒乓球</label>
                <label><input type="checkbox" value="游泳" class="cb-hobby"> 游泳</label>
                <label><input type="checkbox" value="阅读" class="cb-hobby"> 阅读</label>
                <label><input type="checkbox" value="写作" class="cb-hobby"> 写作</label>
            </div>
        </div>

        <div class="flex-row">
            <label style="width:70px;">家庭住址</label>
            <input type="text" id="etAddress" placeholder="请输入住址">
        </div>

        <div style="display:flex; justify-content:center; margin-top:10px;">
            <button class="btn-confirm" onclick="validateAndSave()">确认</button>
            <button class="btn-confirm" onclick="navToList()" style="background:#eee;">取消</button>
        </div>
    </div>

    <!-- Avatar Modal -->
    <div id="avatarModal" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-title">图片选择</div>
            <div class="modal-item" onclick="selectAvatar('026486c12f73a9ae0dcb692cc6313b94_720.png')">
                <img src="img/026486c12f73a9ae0dcb692cc6313b94_720.png"><span>头像1</span>
            </div>
            <div class="modal-item" onclick="selectAvatar('mmexport1775919192723.jpg')">
                <img src="img/mmexport1775919192723.jpg"><span>头像2</span>
            </div>
            <div class="modal-item" onclick="selectAvatar('mmexport1775919248133.jpg')">
                <img src="img/mmexport1775919248133.jpg"><span>头像3</span>
            </div>
            <div class="modal-cancel" onclick="document.getElementById('avatarModal').style.display='none'">取消</div>
        </div>
    </div>

    <div id="toast"></div>
</div>

<script>
    const IMG_MAP = {
        'avatar_1': 'img/026486c12f73a9ae0dcb692cc6313b94_720.png',
        'avatar_2': 'img/mmexport1775919192723.jpg',
        'avatar_3': 'img/mmexport1775919248133.jpg'
    };

    let selectedAvatarFile = '026486c12f73a9ae0dcb692cc6313b94_720.png';

    function selectAvatar(filename) {
        selectedAvatarFile = filename;
        document.getElementById('avatarPreview').src = 'img/' + filename;
        document.getElementById('avatarModal').style.display = 'none';
    }

    let studentList = [
        {id: "23030101", name: "王玲玲", age: "20", gender: "女", clazz: "23计一", phone: "18994230123", address: "江苏省兴化市", avatarImg: "img/026486c12f73a9ae0dcb692cc6313b94_720.png"},
        {id: "2023030202", name: "戴昊", age: "21", gender: "男", clazz: "23计二", phone: "13401358762", address: "江苏省南京市", avatarImg: "img/mmexport1775919192723.jpg"},
        {id: "2023030203", name: "张伟", age: "19", gender: "男", clazz: "23计一", phone: "13800138000", address: "浙江省杭州市", avatarImg: "img/mmexport1775919248133.jpg"}
    ];

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
    }

    function renderList() {
        const container = document.getElementById("list-container");
        container.innerHTML = "";
        studentList.forEach(s => {
            const row = document.createElement("div");
            row.className = "row";
            row.innerHTML = `
                <div class="col-img"><img src="${s.avatarImg || ''}" onerror="this.style.display='none'"></div>
                <div class="col-info">
                    <div class="info-line"><span class="label">学号</span> <span class="val">${s.id}</span></div>
                    <div class="info-line"><span class="label">姓名</span> <span class="val">${s.name}</span></div>
                    <div class="info-line"><span class="label">班级</span> <span class="val">${s.clazz}</span></div>
                    <div class="info-line"><span class="label">手机号</span> <span class="val">${s.phone}</span></div>
                </div>
                <button class="btn-detail" onclick="showToast('你点的是${s.name}学生')">详细</button>
            `;
            container.appendChild(row);
        });
    }

    function navToAdd() {
        document.getElementById("screen-list").classList.add("hidden");
        document.getElementById("screen-add").classList.remove("hidden");
    }

    function navToList() {
        document.getElementById("screen-add").classList.add("hidden");
        document.getElementById("screen-list").classList.remove("hidden");
        renderList();
    }

    function validateAndSave() {
        const id = document.getElementById("etId").value.trim();
        const name = document.getElementById("etName").value.trim();
        const clazz = document.getElementById("etClazz").value.trim();
        const phone = document.getElementById("etPhone").value.trim();
        const address = document.getElementById("etAddress").value.trim();
        const ageStr = document.getElementById("etAge").value.trim();
        const gender = document.querySelector('input[name="gender"]:checked').value;

        if (!id || !name || !phone || !ageStr || !clazz || !address) return showToast("所有项目不能为空");
        if (id.length !== 8 || !/^\d+$/.test(id)) return showToast("学号必须是8位数字");
        if (studentList.some(s => s.id === id)) return showToast("学号不能重复");
        if (phone.length !== 11 || !/^\d+$/.test(phone)) return showToast("手机号必须是11位数字");
        
        const age = parseInt(ageStr);
        if (isNaN(age) || age < 16 || age > 30) return showToast("年龄必须在16~30之间");

        studentList.push({id, name, age, gender, clazz, phone, address, avatarImg: 'img/' + selectedAvatarFile});
        navToList();
        
        document.getElementById("etId").value = "";
        document.getElementById("etName").value = "";
        document.getElementById("etClazz").value = "";
        document.getElementById("etPhone").value = "";
        document.getElementById("etAge").value = "";
        document.getElementById("etAddress").value = "";
        document.querySelectorAll('.cb-hobby').forEach(cb => cb.checked = false);
        selectedAvatarFile = '026486c12f73a9ae0dcb692cc6313b94_720.png';
        document.getElementById('avatarPreview').src = 'img/' + selectedAvatarFile;
    }

    renderList();
</script>
</body>
</html>
