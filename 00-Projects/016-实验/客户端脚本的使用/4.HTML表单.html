<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form id="surveyForm">
        <label for="username">用户名：</label>
        <input type="text" id="username" placeholder="请输入用户名">
        <br><br>
        <label for="pwd">密码：</label>
        <input type="password" id="pwd" placeholder="请输入内容">
        
        <br><br>
        <label >性别：</label>
        <input type="radio" name="gender" value="男">男
        <input type="radio" name="gender" value="女">女
        <br><br>
        <label for="hobby">爱好：</label>
        <input type="checkbox" name="hobby" value="reading">阅读
        <input type="checkbox" name="hobby" value="traveling">旅行
        <input type="checkbox" name="hobby" value="sports">运动
        <br><br>

    <input type="submit" value="提交调查">
        
    </form>
    <form action="#"></form>

    <script>
        // 表单提交时，汇总用户的选择并通过对话框显示
        var form = document.getElementById("surveyForm");
        form.onsubmit = function (event) {
            // 阻止表单的默认提交行为
            if (event && event.preventDefault) {
                event.preventDefault();
            } else {
                // 兼容旧浏览器
                return false;
            }

            // 获取用户名
            var usernameInput = document.getElementById("username");
            var username = usernameInput.value || "(未填写)";

            // 获取性别（单选）
            var genderInputs = document.getElementsByName("gender");
            var gender = "(未选择)";
            for (var i = 0; i < genderInputs.length; i++) {
                if (genderInputs[i].checked) {
                    gender = genderInputs[i].value;
                    break;
                }
            }

            // 获取爱好（多选）
            var hobbyInputs = document.getElementsByName("hobby");
            var hobbies = [];
            for (var j = 0; j < hobbyInputs.length; j++) {
                if (hobbyInputs[j].checked) {
                    hobbies.push(hobbyInputs[j].value);
                }
            }
            var hobbyText = hobbies.length > 0 ? hobbies.join("，") : "(未选择)";

            // 拼接结果字符串
            var result = "用户名：" + username + "\n" +
                         "性别：" + gender + "\n" +
                         "爱好：" + hobbyText;

            // 使用对话框显示用户的选择结果
            alert(result);
        };
    </script>
</body>
</html>
