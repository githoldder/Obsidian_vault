<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM</title>
</head>
<body>
    <div id="box1">这是一个ID选择器标签</div>
    <div class="box2">这是一个类选择器标签</div>
    <div>普通的div标签</div>

    <button>点击按钮</button>
    <script>
        var element_id=document.getElementById('box1');
        console.log(element_id);

        var element_class = document.getElementsByClassName('box2')[0];//获取第一个类选择器
        console.log(element_class);

        var element_tag = document.getElementsByTagName('div')[2];//获取第三个div标签
        console.log(element_tag);
        
        element_id.innerHTML = "<a href='#'>点击这里</a>";
        element_class.innerText = "类选择器标签内容被修改了";
        
        element_tag.style.color = "red";
        element_tag.style.fontSize = "10px";

        //DOM属性绑定事件
        var button_element = document.getElementsByTagName('button')[0];
        console.log(button_element);

        // button_element.onclick = function() {   
        //     alert("按钮被点击了，事件绑定成功！");
        // };
        
        button_element.addEventListener('click',handleClickEvent);

        function handleClickEvent(){
            alert("按钮被点击了，事件绑定成功！");
        }
    </script>
</body>
</html>
