<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位</title>
</head>
<style>
    .box1 {
        width: 600px;
        height: 400px;
        border: 5px solid black;
        position: relative;
    }
    .box-nomal {
        width: 100px;
        height: 100px;
        background-color: lightblue;
        display: inline-block;
    }
    .box-relation {
        width: 100px;
        height: 100px;
        background-color: lightcoral;
        position: relative;
        top: 10px;
        left: 120px;
    }
    .box2 {
        width: 600px;
        height: 400px;
        border: 5px solid black;
        position: relative;
    }
    .box-absolute {
        width: 100px;
        height: 100px;
        background-color: lightpink;
        position: absolute;
        top: 100px;
        left: 0px;
    }
    .box-fixed {
        width: 100px;
        height: 100px;
        background-color: lightgreen;
        position: fixed;
        top: 300px;
        right: 10px;
    }
</style>
<body>
    <h1>相对定位</h1>
    <div class="box1">
        <div class="box-nomal"></div>
        <div class="box-relation"></div>
        <div class="box-nomal"></div>
    </div>
    <h1>绝对定位</h1>
    <div class="box2">
        <div class="box-nomal"></div>
        <div class="box-absolute"></div>
        <div class="box-nomal"></div>
    </div>
    <h1>固定定位</h1>
    <div class="box-fixed"></div>

</body>
</html>
