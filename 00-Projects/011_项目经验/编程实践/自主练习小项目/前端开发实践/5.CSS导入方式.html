<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        p {
            color: green;
            font-size: 18px;
        }
        h1 {
            color: red;
            font-size: 18px;
        }
    </style>
<body>
    <p>这是一个应用了内部 CSS 样式表的段落。</p>
    <h1>这是一个应用了内部 CSS 样式表的标题。</h1>
    <h2 style="color: darkslateblue;">这是一个应用内联样式的标题</h2>
    <h3>这是一个应用外部样式表的三级标题</h3>
    <!--内联样式>内联样式表>外部样式表-->
</body>
</html>
