<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密码检测程序</title>
</head>
<body>
    <h2>密码检测程序</h2>
    <button id="checkBtn">开始检测密码</button>

    <script>
        // 预设的正确密码
        var correctPwd = "123456";

        // 密码检测函数
        function checkPassword() {
            // 使用 prompt 对话框获取用户输入的密码
            var inputPwd = prompt("请输入密码：");

            // 如果用户点击了取消，inputPwd 为 null，这里统一按输入错误处理
            if (inputPwd === null) {
                alert("输入错误");
                return;
            }

            // 比较用户输入和预设密码是否相同
            if (inputPwd === correctPwd) {
                alert("输入正确");
            } else {
                alert("输入错误");
            }
        }

        // 给按钮绑定点击事件
        var btn = document.getElementById("checkBtn");
        btn.onclick = checkPassword;
    </script>
</body>
</html>
